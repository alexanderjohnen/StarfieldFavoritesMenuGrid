; ============================================================================
; Favorites Menu Grid - SFSE
;
; Several rows of Starfield's twelve favorite slots, drawn all at once as a
; grid you can click and edit.
;
; Each option is listed first, its accepted values next, and what it does
; underneath. Section names cannot be renamed.
; ============================================================================


; ----------------------------------------------------------------------------
[Grid]
; ----------------------------------------------------------------------------

RowCount=4
; 2 to 8 rows.   Default: 4
; Each row is a full set of the twelve normal favorite slots. Changing this
; needs a game restart.

DefaultRow=1
; 1 to RowCount.   Default: 1
; The row put back into the game's real twelve slots every time you close the
; menu. Your gameplay quickkeys 1-0 therefore always mean this row, whatever
; you clicked while the menu was open.

PowerIconScalePercent=300
; 50 to 800 percent.   Default: 300
; Power icons measure much larger than the symbol you actually see, so
; fitting them to a cell leaves them tiny. This scales them back up. Raise it
; if powers still look small, lower it if they spill over their cell.


; ----------------------------------------------------------------------------
[Controls]
; ----------------------------------------------------------------------------

ClearSlotKey=DELETE
; A key name (DELETE, F5, HOME, NUMPAD1, a letter or digit), a numeric VK
; code, or NONE / 0 for no key.   Default: DELETE
; Empties the cell under the cursor while the menu is open. Starfield cannot
; remove a favorite at all by itself, only overwrite one. In the grid the red
; X does the same thing while EDIT is on.

ToggleEquipOnSelect=1
; 0 = always equip, 1 = second click unequips.   Default: 1
; Applies to equippable items only, never aid, ammo or powers.

ExternallyManagedSlots=NONE
; Slot numbers 1 to 12, comma separated, or NONE / 0 for none.
; Default: NONE
;
; For slots that another mod writes into by itself. Such a slot is left
; completely alone: never captured into a row, never overwritten, and shown
; once in the right-hand strip instead of in every row. Without this, that
; mod's item ends up copied onto every row you visit and your other
; favorites get shuffled around.
;
; Each slot listed here is one column fewer on every row, so the last slot
; (12) is usually the best choice - the remaining columns then read without a
; gap in the middle.
;
; Built for UC Classified Gear Sets - AEGIS Prototype Armor by the same
; author, whose Technician set shares one slot between a deployable turret
; and its recall item:
;   https://www.nexusmods.com/starfield/mods/17579

PinnedSymbols=1
; 0 = use the game's icon, 1 = draw a symbol.   Default: 1
; Only affects reserved slots (see ExternallyManagedSlots). An editor ID
; containing "turret" gets a turret, one containing "recall" gets a handheld
; transmitter; anything else keeps its normal icon. Reserved slots are the
; one place the game's icon data is unreliable.
